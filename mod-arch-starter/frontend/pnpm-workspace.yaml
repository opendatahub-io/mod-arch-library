# pnpm settings for standalone / kubeflow deployments (single-package workspace).
# pnpm >=10 reads these from pnpm-workspace.yaml rather than package.json / .npmrc.
packages:
  - '.'

# Keep a flat node_modules layout so the rspack config's PatternFly asset/CSS include paths
# (node_modules/@patternfly/...) resolve without a pnpm-aware resolver. Mirrors the temporary
# approach odh-dashboard uses during its pnpm migration.
shamefullyHoist: true
autoInstallPeers: true

# Allow build scripts only for the dependencies that need them (pnpm blocks them by default).
# pnpm 11 (the pinned packageManager) reads this `allowBuilds` map; the map form is required.
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  cypress: true
  esbuild: true
  unrs-resolver: true

overrides:
  js-yaml: ^4.1.1
  csstype: 3.1.3
  axios: ^1.18.0
  # No lockfile ships with the starter, so pin the @mui/material family to one version. @mui
  # requires every @mui/* package on the same version; letting them float independently lets
  # @mui/material drift ahead of @mui/utils (e.g. material@7.3.11 imports @mui/utils/contains,
  # which only exists in matching utils), breaking the rspack build. @mui/types tracks its own
  # (7.4.x) line and is intentionally not pinned here.
  '@mui/material': 7.3.8
  '@mui/utils': 7.3.8
  '@mui/system': 7.3.8
  '@mui/icons-material': 7.3.8
  '@mui/private-theming': 7.3.8
  '@mui/styled-engine': 7.3.8
